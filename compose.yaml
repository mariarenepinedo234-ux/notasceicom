services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ceicom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      POSTGRES_DB: ceicom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ceicom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceicom -d ceicom"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ceicom_pg:
